[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "itl-braincell-cells-operations"
version = "0.1.0"
description = "Operations & Project Management cell collection for ITL BrainCell — tasks, jobs, persons, interactions, and sessions"
requires-python = ">=3.12"
dependencies = [
    "itl-braincell-sdk>=0.1.0",
    "fastapi>=0.127.0",
    "pydantic>=2.12.3",
    "sqlalchemy>=2.0.46",
]
authors = [
    { name = "ITL", email = "dev@itlusions.com" }
]

[project.urls]
Repository = "https://github.com/ITlusions/itl-braincell-cells-operations"

[tool.setuptools.packages.find]
where = ["src"]
include = ["itl_braincell_cells_operations*"]

[project.entry-points."itl_braincell_sdk.cell_plugins"]
operations = "itl_braincell_cells_operations.cells:plugin"
